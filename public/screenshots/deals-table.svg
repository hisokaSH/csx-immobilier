    <text x="60" y="352" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">Seller</text>
    <text x="250" y="343" font-family="system-ui, sans-serif" font-size="13" fill="#475569">📍 8 Avenue Victor Hugo, Lyon</text>
    <rect x="520" y="328" width="90" height="24" rx="5" fill="#FEF3C7"/>
    <text x="532" y="345" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#B45309">Offer Received</text>
    <text x="700" y="343" font-family="system-ui, sans-serif" font-size="13" fill="#64748B">3 days ago</text>
    <rect x="850" y="328" width="75" height="24" rx="5" fill="#FEE2E2"/>
    <text x="860" y="345" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#DC2626">2d overdue</text>
    
    <!-- Row 3 -->
    <line x1="40" y1="365" x2="1060" y2="365" stroke="#F1F5F9" stroke-width="1"/>
    <text x="60" y="395" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#1E293B">Sophie Bernard</text>
    <text x="60" y="412" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">Buyer</text>
    <text x="250" y="403" font-family="system-ui, sans-serif" font-size="13" fill="#475569">📍 42 Boulevard Haussmann, Paris</text>
    <rect x="520" y="388" width="100" height="24" rx="5" fill="#DBEAFE"/>
    <text x="532" y="405" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#1D4ED8">Financing Check</text>
    <text x="700" y="403" font-family="system-ui, sans-serif" font-size="13" fill="#64748B">5 days ago</text>
    <rect x="850" y="388" width="75" height="24" rx="5" fill="#FEE2E2"/>
    <text x="860" y="405" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#DC2626">2d overdue</text>
    
    <!-- Row 4 -->
    <line x1="40" y1="425" x2="1060" y2="425" stroke="#F1F5F9" stroke-width="1"/>
    <text x="60" y="455" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#1E293B">Lucas Moreau</text>
    <text x="60" y="472" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">Buyer</text>
    <text x="250" y="463" font-family="system-ui, sans-serif" font-size="13" fill="#475569">📍 23 Rue du Commerce, Paris</text>
    <rect x="520" y="448" width="100" height="24" rx="5" fill="#DBEAFE"/>
    <text x="532" y="465" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#1D4ED8">New Lead (Buyer)</text>
    <text x="700" y="463" font-family="system-ui, sans-serif" font-size="13" fill="#64748B">1 day ago</text>
    <rect x="850" y="448" width="65" height="24" rx="5" fill="#FEF3C7"/>
    <text x="860" y="465" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#B45309">Due today</text>
    
    <!-- Row 5 -->
    <line x1="40" y1="485" x2="1060" y2="485" stroke="#F1F5F9" stroke-width="1"/>
    <text x="60" y="515" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#1E293B">Emma Petit</text>
    <text x="60" y="532" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">Seller</text>
    <text x="250" y="523" font-family="system-ui, sans-serif" font-size="13" fill="#475569">📍 156 Avenue Jean Jaurès, Lyon</text>
    <rect x="520" y="508" width="100" height="24" rx="5" fill="#F0FDF4"/>
    <text x="532" y="525" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#15803D">New Lead (Seller)</text>
    <text x="700" y="523" font-family="system-ui, sans-serif" font-size="13" fill="#64748B">1 day ago</text>
    <rect x="850" y="508" width="65" height="24" rx="5" fill="#FEF3C7"/>
    <text x="860" y="525" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#B45309">Due today</text>
    
    <!-- Row 6 -->
    <line x1="40" y1="545" x2="1060" y2="545" stroke="#F1F5F9" stroke-width="1"/>
    <text x="60" y="573" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#1E293B">Camille Fournier</text>
    <text x="60" y="590" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">Buyer</text>
    <text x="250" y="581" font-family="system-ui, sans-serif" font-size="13" fill="#475569">📍 34 Quai des Chartrons, Bordeaux</text>
    <rect x="520" y="566" width="110" height="24" rx="5" fill="#FEF3C7"/>
    <text x="532" y="583" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#B45309">Offer Preparation</text>
    <text x="700" y="581" font-family="system-ui, sans-serif" font-size="13" fill="#64748B">1 day ago</text>
    <rect x="850" y="566" width="80" height="24" rx="5" fill="#DCFCE7"/>
    <text x="860" y="583" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#15803D">1d remaining</text>
  </g>
</svg>
